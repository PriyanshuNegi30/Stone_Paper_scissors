<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="heading">
        <h1>Rock Paper Scissors</h1>
    </div>

    <div id="container">
        <div class="box" id="stone"></div>
        <div class="box" id="paper"></div>
        <div class="box" id="scissor"></div>
    </div>

    <div id="score">
        <div id="userscore">
            <div id="userpoint">0</div>
            <div>You</div>
        </div>

        <div id="cmpscore">
            <div id="cmppoint">0</div>
            <div>Com</div>
        </div>
    </div>

    <div id="result">
        <div id="comment">Pick Your Move</div>
    </div>

    <div id="reset-container">
        <button id="restart"> Reset</button>
    </div>

</body>

<script src="style.js"></script>
</html>
